name: App delivery

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/app-delivery.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: app-delivery-main
  cancel-in-progress: true

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate Docker to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: apps
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/sample-backend:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/sample-frontend:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Promote immutable images through GitOps
        run: |
          sed -i "/name: sample-backend/,/newTag:/ {
            s#newName: .*#newName: ${{ vars.ACR_LOGIN_SERVER }}/sample-backend#
            s#newTag: .*#newTag: $GITHUB_SHA#
          }" kubernetes/apps/sample/overlays/dev/kustomization.yaml
          sed -i "/name: sample-frontend/,/newTag:/ {
            s#newName: .*#newName: ${{ vars.ACR_LOGIN_SERVER }}/sample-frontend#
            s#newTag: .*#newTag: $GITHUB_SHA#
          }" kubernetes/apps/sample/overlays/dev/kustomization.yaml
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kubernetes/apps/sample/overlays/dev/kustomization.yaml
            git commit -m "chore: promote sample images to ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
