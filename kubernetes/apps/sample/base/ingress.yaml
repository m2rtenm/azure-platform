apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sample.example.invalid
      secretName: sample-app-tls
  rules:
    - host: sample.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-frontend
                port:
                  name: http
