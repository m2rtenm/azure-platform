apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: sample-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: postgresql-connection-string
