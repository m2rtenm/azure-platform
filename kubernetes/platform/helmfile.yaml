repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: secrets-store-csi-driver
    url: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.12.0
    values:
      - ingress-nginx/values.yaml

  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.16.2
    values:
      - cert-manager/values.yaml

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 0.15.1
    values:
      - external-secrets/values.yaml

  - name: csi-secrets-store
    namespace: kube-system
    chart: secrets-store-csi-driver/secrets-store-csi-driver
    version: 1.4.8
    values:
      - csi-secrets-store/values.yaml

  - name: kube-prometheus-stack
    namespace: observability
    chart: prometheus-community/kube-prometheus-stack
    version: 67.9.0
    values:
      - observability/kube-prometheus-stack-values.yaml

  - name: loki
    namespace: observability
    chart: grafana/loki
    version: 6.24.0
    values:
      - observability/loki-values.yaml

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 7.7.3
    values:
      - argocd/values.yaml
